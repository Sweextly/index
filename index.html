<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#fff1e3;--card:#fffaf4;--ink:#5a2d2d;--pink:#f27a96;--red:#e0475b;--soft:#ffd2bb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(var(--soft) 2px,transparent 2.5px) 0 0/30px 30px,linear-gradient(180deg,#ffdfca,var(--bg) 35%,#ffe4ec);background-color:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow-x:hidden}
.script{font-family:'Pacifico','Brush Script MT',cursive}
.card{background:var(--card);border:3px solid var(--pink);border-radius:28px;box-shadow:0 8px 0 var(--soft)}
.rise{position:fixed;bottom:-40px;pointer-events:none;animation:rise linear infinite;opacity:.7;z-index:0}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.fall{position:fixed;top:-30px;pointer-events:none;font-size:28px;animation:fall 2.4s ease-in forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.flip{perspective:900px}.inner{transition:transform .6s;transform-style:preserve-3d;position:relative}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.back{transform:rotateY(180deg)}
.fade{animation:fade .8s both}@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.btn{background:var(--pink);color:#fff;border:3px solid var(--red);border-radius:999px;padding:10px 26px;font-weight:600;box-shadow:0 5px 0 var(--red);cursor:pointer;transition:transform .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/plain" id="tsx">
const { useState, useEffect, useRef, useMemo } = React;

type Reason = { icon: string; title: string; text: string };

// ✏️ EDITA ESTO: nombre, fecha de inicio y textos personales
const CONFIG = {
  nombre: "Beatriz",
  desde: "2024-06-14T00:00:00",
  carta: [
    "Holii, sé que esto no es ni la mitad de lo que tu deberias merecer, sin embargo, siento que es un lindo detalle de igual forma. Espero te guste y que lo aprecies ya que todo lo que ves esta hecho con mucho esfuerzo.",
  ],
  razones: [
    { icon: "<3", title: "Tu sonrisa", text: "Me alegra mis dias." },
    { icon: "𔓐𑇓", title: "Tu Forma de pensar", text: "Única y diferente." },
    { icon: "ᥬᩤ", title: "Tus detalles", text: "Notas todo, hasta lo que yo olvido." },
    { icon: "❨", title: "Tus abrazos", text: "Mi lugar favorito en todo el mundo." },
    { icon: "ᯓ★", title: "Tu forma de ser", text: "Auténtica, linda y unica." },
    { icon: "𑣲𝓑", title: "Tu corazon", text: "Es mi cosa favorita de ti." },
  ] as Reason[],
};

const say = () => window.dispatchEvent(new Event("love"));

declare const IMG: Record<string, string>;
function Pic({ k, w, alt, tap }: { k: string; w: number; alt: string; tap?: boolean }) {
  return <img src={IMG[k]} alt={alt} onClick={tap ? say : undefined} draggable={false} className="bob mx-auto select-none block" style={{ width: w, maxWidth: "62vw", height: "auto", cursor: tap ? "pointer" : "default" }} />;
}

function Floaties() {
  const items = useMemo(() => Array.from({ length: 16 }, (_, i) => ({
    e: ["🎀", "💗", "⭐", "🍓", "✨", "🌸"][i % 6], l: Math.random() * 96,
    d: 11 + Math.random() * 12, dl: -Math.random() * 20, s: 16 + Math.random() * 18,
  })), []);
  return <>{items.map((o, i) => <span key={i} className="rise" style={{ left: o.l + "%", animationDuration: o.d + "s", animationDelay: o.dl + "s", fontSize: o.s }}>{o.e}</span>)}</>;
}

function Counter() {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const s = Math.max(0, Math.floor((now - new Date(CONFIG.desde).getTime()) / 1000));
  const u: [number, string][] = [[Math.floor(s / 86400), "días"], [Math.floor(s / 3600) % 24, "horas"], [Math.floor(s / 60) % 60, "min"], [s % 60, "seg"]];
  return (
    <div className="grid grid-cols-4 gap-2 sm:gap-4 max-w-xl mx-auto">
      {u.map(([n, l]) => (
        <div key={l} className="card py-3 text-center" style={{ borderRadius: 20 }}>
          <div className="text-3xl sm:text-5xl font-semibold" style={{ color: "var(--red)" }}>{n}</div>
          <div className="text-xs sm:text-sm opacity-80">{l}</div>
        </div>
      ))}
    </div>
  );
}

function Flip({ r }: { r: Reason }) {
  const [on, setOn] = useState(false);
  return (
    <button className="flip h-48 w-full" onClick={() => { setOn(!on); if (!on) say(); }} aria-label={r.title}>
      <div className="inner h-full" style={{ transform: on ? "rotateY(180deg)" : "none" }}>
        <div className="face card"><div className="text-5xl">{r.icon}</div><div className="mt-2 font-semibold">{r.title}</div><div className="text-xs opacity-60 mt-1">toca para girar</div></div>
        <div className="face card back" style={{ background: "var(--pink)", color: "#fff" }}><div className="text-base sm:text-lg leading-snug">{r.text}</div></div>
      </div>
    </button>
  );
}

function Letter() {
  const [open, setOpen] = useState(false);
  return (
    <div className="card p-5 sm:p-6 max-w-2xl mx-auto text-center">
      {!open ? (
        <button className="btn" onClick={() => { setOpen(true); say(); }}>💌 Abrir mi carta</button>
      ) : (
        <div className="text-left space-y-3 text-base sm:text-lg">
          {CONFIG.carta.map((p, i) => <p key={i} className="fade" style={{ animationDelay: i * 0.9 + "s" }}>{p}</p>)}
          <p className="script text-2xl text-right fade" style={{ animationDelay: CONFIG.carta.length * 0.9 + "s", color: "var(--red)" }}>Con amor 🎀</p>
        </div>
      )}
    </div>
  );
}

function Question() {
  const [no, setNo] = useState({ x: 0, y: 0, n: 0 });
  const [yes, setYes] = useState(false);
  const dodge = () => setNo(p => ({ x: (Math.random() - 0.5) * 150, y: (Math.random() - 0.5) * 90, n: p.n + 1 }));
  if (yes) return <div className="card p-5 sm:p-8 text-center max-w-xl mx-auto fade"><div className="script text-4xl" style={{ color: "var(--red)" }}>¡Sabía que dirías que sí! 💖</div><p className="mt-3 text-lg">Eres lo mejor que me ha pasado.</p></div>;
  return (
    <div className="card p-5 sm:p-8 text-center max-w-xl mx-auto">
      <div className="script text-2xl sm:text-3xl mb-6">¿Quieres estar conmigo en este camino al que denominamos "vida"?</div>
      <div className="flex items-center justify-center gap-6 min-h-[90px]">
        <button className="btn" style={{ transform: `scale(${1 + no.n * 0.18})` }} onClick={() => { setYes(true); for (let i = 0; i < 4; i++) setTimeout(say, i * 250); }}>Sí 💕</button>
        <button className="btn" style={{ background: "var(--card)", color: "var(--ink)", transform: `translate(${no.x}px,${no.y}px)`, transition: "transform .25s" }} onPointerEnter={dodge} onClick={dodge}>No</button>
      </div>
    </div>
  );
}

function App() {
  const [drops, setDrops] = useState<{ id: number; x: number; e: string }[]>([]);
  useEffect(() => {
    const h = () => {
      const add = Array.from({ length: 10 }, () => ({ id: Math.random(), x: Math.random() * 96, e: ["💗", "🎀", "💖", "⭐", "🍓"][Math.floor(Math.random() * 5)] }));
      setDrops(d => [...d, ...add]);
      setTimeout(() => setDrops(d => d.filter(o => !add.includes(o))), 2600);
    };
    window.addEventListener("love", h);
    return () => window.removeEventListener("love", h);
  }, []);
  const H = ({ children }: { children: string }) => <h2 className="script text-2xl sm:text-4xl text-center mb-6" style={{ color: "var(--red)" }}>{children}</h2>;
  return (
    <main className="relative z-10 px-4 py-8 space-y-12 sm:space-y-16 max-w-4xl mx-auto">
      <Floaties />
      {drops.map(o => <span key={o.id} className="fall" style={{ left: o.x + "%" }}>{o.e}</span>)}
      <header className="text-center flex flex-col items-center gap-3">
        <Pic k="flower" w={230} alt="Hello Kitty con una flor" tap />
        <h1 className="script text-3xl sm:text-6xl" style={{ color: "var(--red)" }}>Para ti, {CONFIG.nombre}</h1>
        <p className="text-lg opacity-80">Toca la hello kitty 💗</p>
      </header>
      <section><H>Llevamos juntos</H><Counter /><div className="mt-8"><Pic k="cam" w={170} alt="Hello Kitty con una cámara" /></div><p className="text-center mt-2 opacity-80">Cada momento contigo merece una foto 📸</p></section>
      <section><H>Razones por las que te quiero</H>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">{CONFIG.razones.map(r => <Flip key={r.title} r={r} />)}</div>
      </section>
      <section><H>Una cartita para ti</H><Letter /></section>
      <section><H>Una pregunta importante</H><div className="mb-5"><Pic k="bow" w={190} alt="Hello Kitty con un lazo grande" /></div><Question /></section>
      <footer className="text-center opacity-70 pb-6">Hecho con amor 🎀</footer>
    </main>
  );
}
ReactDOM.createRoot(document.getElementById("root")!).render(<App />);
</script>
